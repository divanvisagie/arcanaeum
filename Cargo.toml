[package]
name = "arcanaeum"
version = "0.2.9"
edition = "2021"
license = "BSD-3-Clause"
description = "Reads your Skyrim saves to find which mods each one needs, and manages the load order"
repository = "https://github.com/divanvisagie/arcanaeum"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rfd = "0.17"
tracing = "0.1.29"
tracing-subscriber = "0.3.3"
eframe = "0.35"
egui = "0.35"
patina-ui = "0.1.7"
egui_extras = "0.35"
toml = "1"
urlencoding = "2.1.0"
rmp = "0.8.10"
webbrowser = "0.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.74"
serde_yaml = "0.8.23"
futures = "0.3.19"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
skyplug-core = { version = "0.2.0", path = "../skyplug/crates/skyplug-core" }
image = { version = "0.23", default-features = false, features = [
    "jpeg",
    "png",
] }
dirs = "5.0.0"
rust-ini = "0.19"

[profile.dev]
opt-level = 0
debug = true

[dev-dependencies]
resvg = "0.48.1"
